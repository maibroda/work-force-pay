name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workforcepay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforcepay?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforcepay_test?schema=public
      # CI-only placeholder — never use this value outside CI.
      AUTH_SECRET: ci-only-secret-not-for-production-use-minimum-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE workforcepay_test;"

      - name: Apply migrations (primary database)
        run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - name: Test (runs its own migrate + seed against TEST_DATABASE_URL)
        run: npm test

      - run: npm run build
