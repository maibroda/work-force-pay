name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workforcepay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforcepay?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforcepay_test?schema=public
      # CI-only placeholder — never use this value outside CI.
      AUTH_SECRET: ci-only-secret-not-for-production-use-minimum-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE workforcepay_test;"

      - name: Apply migrations (primary database)
        run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - name: Test (runs its own migrate + seed against TEST_DATABASE_URL)
        run: npm test

      - run: npm run build

      # Opens every page as every demo role against the freshly built app and a seeded database: permitted
      # pages must render (no 500s), forbidden ones must redirect, signed-out requests must go to /login.
      - name: Smoke test (every page, every role)
        run: |
          npx tsx prisma/seed.ts
          npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3100/login && break; sleep 2; done
          BASE_URL=http://localhost:3100 npm run smoke || { echo "--- server log (tail) ---"; tail -60 server.log; exit 1; }

      # The books must be internally consistent on the seeded database: every journal balances, every locked payroll
      # run has its journal, receivables and payables subledgers equal their ledger control accounts.
      - name: Ledger integrity check
        run: npm run ledger:check

      # A backup that has never been restored is a hope. Dump the seeded database, load it into a scratch database,
      # run the integrity check there and compare it with the live one.
      - name: Backup and restore rehearsal
        run: |
          npm run db:backup
          npm run db:restore-check -- "$(ls -t backups/*.dump | head -1)"
